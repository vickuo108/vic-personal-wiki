  <meta name="course-origin" content="超級 AI 個體・personal-wiki 課程版 Skill">

  <style>
    :root{
      color-scheme:light;
      --paper:#f7f5f0;--surface:#fffdfa;--ink:#171918;--muted:#68706d;--rule:#d9ddd9;
      --teal:#21a4b1;--teal-dark:#0e6770;--teal-soft:#e3f5f6;--orange:#e77e47;
      --private:#a23b3b;--private-soft:#fff0ee;--shadow:0 16px 42px rgba(23,25,24,.08);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.75}
    a{color:var(--teal-dark);text-underline-offset:3px}
    button,input{font:inherit}
    .shell{max-width:1240px;margin:auto;padding:32px 24px 64px}
    .hero{position:relative;overflow:hidden;background:linear-gradient(110deg,#f6b3b3 0%,#ffd3a3 20%,#fff6ad 40%,#b3d9bd 60%,#b3caff 80%,#d7b5db 100%);color:#111;border-radius:22px;padding:38px 36px;box-shadow:var(--shadow)}
    .eyebrow{position:relative;z-index:1;color:#fff;font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
    .eyebrow span{display:inline-block;background:var(--teal);padding:5px 10px;margin-right:8px}
    h1{position:relative;z-index:1;margin:0;font-size:clamp(1.25rem,2.8vw,2.25rem);line-height:1.08;letter-spacing:-.04em}
    .hero p{position:relative;z-index:1;max-width:690px;margin:.35rem 0;color:#cbd2cf}
    .warning{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:8px 12px;border-left:4px solid var(--orange);background:#272b29;color:#fff;font-weight:700}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
    .stat{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:15px 17px}
    .stat strong{display:block;font-size:1.6rem;line-height:1.2}.stat span{color:var(--muted);font-size:.82rem}
    .layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
    .sidebar,.article{background:var(--surface);border:1px solid var(--rule);border-radius:18px;box-shadow:var(--shadow)}
    .sidebar{position:sticky;top:18px;padding:16px;max-height:calc(100vh - 36px);overflow:auto}
    .search{width:100%;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
    .filters{display:flex;gap:7px;margin:10px 0 14px;flex-wrap:wrap}
    .filter{border:1px solid var(--rule);border-radius:999px;padding:5px 10px;background:#fff;cursor:pointer;color:var(--muted);font-size:.78rem}
    .filter.active{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-dark);font-weight:800}
    .entry-list{display:grid;gap:8px}
    .entry-card{width:100%;text-align:left;border:1px solid transparent;border-radius:12px;padding:11px;background:transparent;cursor:pointer;color:var(--ink)}
    .entry-card:hover,.entry-card.active{border-color:var(--teal);background:var(--teal-soft)}
    .entry-title{display:block;font-weight:800;line-height:1.4}.entry-meta{display:flex;align-items:center;gap:7px;margin-top:6px;color:var(--muted);font-size:.74rem}
    .badge{display:inline-flex;border-radius:999px;padding:2px 7px;font-size:.68rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
    .badge.public{background:var(--teal-soft);color:var(--teal-dark)}
    .badge.private{background:var(--private-soft);color:var(--private)}
    .article{min-height:620px;padding:clamp(24px,5vw,58px)}
    .article-header{padding-bottom:20px;border-bottom:1px solid var(--rule);margin-bottom:26px}
    .article h2{margin-top:2.2rem;line-height:1.3}.article h3{margin-top:1.6rem;line-height:1.35}.article p{max-width:76ch}
    .article ul{padding-left:1.35rem}.article li+li{margin-top:.35rem}.article strong{font-weight:800}
    .article .footnote{font-size:.88rem;color:var(--muted);padding-left:1rem;border-left:3px solid var(--rule)}
    .footnote-ref{color:var(--teal-dark);font-weight:800}.broken-link{color:var(--private);text-decoration:underline wavy}
    .empty{padding:36px;color:var(--muted);text-align:center}
    footer{margin-top:24px;padding:24px;text-align:center;color:var(--muted);font-size:.8rem;border-top:1px solid var(--rule)}
    footer strong{color:var(--ink)}footer .license{margin-top:7px;font-size:.72rem}
    @media(max-width:820px){.shell{padding:16px 12px 42px}.hero{padding:26px 22px}.stats{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.article{min-height:0;padding:24px}}

  <script id="entry-data" type="application/json">[{"id": "profile-palette-of-dreams", "title": "Vic 人生時間軸", "type": "timeline", "visibility": "public", "path": "", "summary": "這條時間軸依序整理 Vic 的職涯選擇、追星經歷與生活陪伴。日期與事件以其公開個人主頁為依據；已發生的經歷與尚未確認達成的目標分開列出。", "html": "\u003cp>這條時間軸依序整理 Vic 的職涯選擇、追星經歷與生活陪伴。日期與事件以其公開個人主頁為依據；已發生的經歷與尚未確認達成的目標分開列出。\u003c/p>\n\u003ch3>2018 — 認識精算，開始養狗\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>1 月｜接觸精算\u003c/strong>：金融系求學期間曾擔任保險業務員，認同保險的價值，卻發現業務角色不適合自己。看到介紹精算師的 YouTube 影片後，開始朝數學、統計與風險相關研究所發展。\u003c/li>\n\u003cli>\u003cstrong>5 月 3 日｜咪嚕加入生活\u003c/strong>：在 Facebook 社團看到尋找主人的狗，之後將咪嚕帶回家，開始養狗生活。\u003c/li>\n\u003c/ul>\n\u003ch3>2019 — 從韓劇認識 IU\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>7 月｜追星的起點\u003c/strong>：因《德魯納酒店》認識 IU，進一步接觸她的音樂，開始以 Uaena 的身分參與追星生活。\u003c/li>\n\u003c/ul>\n\u003ch3>2021 — 走進精算職場\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>8 月｜第一份工作\u003c/strong>：開始累積精算實務。主管鼓勵他不懂就問，讓他逐步熟悉工作。\u003c/li>\n\u003c/ul>\n\u003ch3>2023 — 第一場演唱會\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>9 月｜赴韓看 IU\u003c/strong>：飛往韓國參加人生第一場演唱會，現場體驗讓他更積極爭取參與後續演出的機會。\u003c/li>\n\u003c/ul>\n\u003ch3>2024 — 帶新人，也拓展追星生活\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>3 月｜升職與帶新人\u003c/strong>：在工作約兩年半後獲得主管提拔，開始有帶新人的機會；他將這段經歷描述為認真被看見。\u003c/li>\n\u003cli>\u003cstrong>年度回顧｜三次赴韓觀演\u003c/strong>：在一年中飛往韓國三次，觀看三場演唱會，其中一場為 VIP；也因共同喜好認識其他粉絲。主頁把這段回顧列於 9 月，不表示三場演唱會都在 9 月舉行。\u003c/li>\n\u003c/ul>\n\u003ch3>2026 — 升任襄理，可頌加入家庭\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>3 月｜升任襄理\u003c/strong>：公開主頁記錄的職涯里程碑。\u003c/li>\n\u003cli>\u003cstrong>8 月 23 日｜可頌加入生活\u003c/strong>：在寵物店遇見馬爾泰迪可頌並帶回家；最初在店內安靜，回家後則展現活潑頑皮的一面。\u003c/li>\n\u003c/ul>"}, {"id": "career-personal-achievements", "title": "個人生涯成就表", "type": "profile", "visibility": "public", "path": "", "summary": "依原表欄位逐項整理，共 6 筆專案。襄理任職日期已依本人更正為 2026 年 3 月。", "html": "\u003cp>依原表欄位逐項整理，共 6 筆專案。襄理任職日期已依本人更正為 2026 年 3 月。\u003c/p>\n\u003ch2>1. 監控短年期實支實付之損失率\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>期間（起）\u003c/strong>：2023/01/01\u003c/li>\n\u003cli>\u003cstrong>期間（訖）\u003c/strong>：2023/12/31\u003c/li>\n\u003cli>\u003cstrong>公司\u003c/strong>：全球人壽\u003c/li>\n\u003cli>\u003cstrong>職位\u003c/strong>：專員\u003c/li>\n\u003cli>\u003cstrong>專案\u003c/strong>：監控短年期實支實付之損失率\u003c/li>\n\u003cli>\u003cstrong>分類\u003c/strong>：損失率\u003c/li>\n\u003cli>\u003cstrong>成就／貢獻／產出\u003c/strong>：協助主管找出損失率異常之關鍵因素，提出 60 位業務員及 5 個通訊處理賠異常警示，促使公司製作理賠異常監控報表及相關單位（如 PM、通路）制定措施管控保戶和業務員品質。\u003c/li>\n\u003c/ul>\n\u003ch2>2. 綜合險損失率\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>期間（起）\u003c/strong>：2023/01/01\u003c/li>\n\u003cli>\u003cstrong>期間（訖）\u003c/strong>：2023/12/31\u003c/li>\n\u003cli>\u003cstrong>公司\u003c/strong>：全球人壽\u003c/li>\n\u003cli>\u003cstrong>職位\u003c/strong>：專員\u003c/li>\n\u003cli>\u003cstrong>專案\u003c/strong>：綜合險損失率\u003c/li>\n\u003cli>\u003cstrong>分類\u003c/strong>：損失率\u003c/li>\n\u003cli>\u003cstrong>成就／貢獻／產出\u003c/strong>：就過去尚未建立損失率資料的綜合險，協助驗證 PD 提供的預期成本 factor，並依此建立執行損失率作業。\u003c/li>\n\u003c/ul>\n\u003ch2>3. 費用假設\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>期間（起）\u003c/strong>：2024/01/01\u003c/li>\n\u003cli>\u003cstrong>期間（訖）\u003c/strong>：2024/12/31\u003c/li>\n\u003cli>\u003cstrong>公司\u003c/strong>：全球人壽\u003c/li>\n\u003cli>\u003cstrong>職位\u003c/strong>：主任\u003c/li>\n\u003cli>\u003cstrong>專案\u003c/strong>：費用假設\u003c/li>\n\u003cli>\u003cstrong>分類\u003c/strong>：費用\u003c/li>\n\u003cli>\u003cstrong>成就／貢獻／產出\u003c/strong>：配合 IFRS 17／AA 時程，完成費用假設釐訂，提出兩種不同預估方法之比較，使 AA Team 能評估不同方法所達成的結果。\u003c/li>\n\u003c/ul>\n\u003ch2>4. 建立 IFRS 17 費用假設\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>期間（起）\u003c/strong>：2025/01/01\u003c/li>\n\u003cli>\u003cstrong>期間（訖）\u003c/strong>：2025/12/31\u003c/li>\n\u003cli>\u003cstrong>公司\u003c/strong>：全球人壽\u003c/li>\n\u003cli>\u003cstrong>職位\u003c/strong>：主任\u003c/li>\n\u003cli>\u003cstrong>專案\u003c/strong>：建立 IFRS 17 費用假設\u003c/li>\n\u003cli>\u003cstrong>分類\u003c/strong>：費用\u003c/li>\n\u003cli>\u003cstrong>成就／貢獻／產出\u003c/strong>：配合接軌 IFRS 17，測試並規劃執行新版費用假設訂定流程。\u003c/li>\n\u003c/ul>\n\u003ch2>5. 金融檢查、同業裁罰\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>期間（起）\u003c/strong>：2025/11/01\u003c/li>\n\u003cli>\u003cstrong>期間（訖）\u003c/strong>：2025/11/30\u003c/li>\n\u003cli>\u003cstrong>公司\u003c/strong>：全球人壽\u003c/li>\n\u003cli>\u003cstrong>職位\u003c/strong>：主任\u003c/li>\n\u003cli>\u003cstrong>專案\u003c/strong>：金融檢查、同業裁罰\u003c/li>\n\u003cli>\u003cstrong>分類\u003c/strong>：金檢\u003c/li>\n\u003cli>\u003cstrong>成就／貢獻／產出\u003c/strong>：涉略法遵領域，於部門會議說明壽險業檢查缺失態樣、金融檢查重點、同業裁罰及精算作業相關法令之更新。\u003c/li>\n\u003c/ul>\n\u003ch2>6. 負債適足性測試（LAT）\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>期間（起）\u003c/strong>：2026/01/01\u003c/li>\n\u003cli>\u003cstrong>期間（訖）\u003c/strong>：2026/07/31\u003c/li>\n\u003cli>\u003cstrong>公司\u003c/strong>：全球人壽\u003c/li>\n\u003cli>\u003cstrong>職位\u003c/strong>：襄理\u003c/li>\n\u003cli>\u003cstrong>專案\u003c/strong>：負債適足性測試（LAT）\u003c/li>\n\u003cli>\u003cstrong>分類\u003c/strong>：負債適足性測試（LAT）\u003c/li>\n\u003cli>\u003cstrong>成就／貢獻／產出\u003c/strong>：配合公司 KH 不接軌 IFRS 17，重新建立 LAT 的做法。\u003c/li>\n\u003c/ul>"}]</script>
  <script>
    const entries=JSON.parse(document.getElementById('entry-data').textContent);
    const list=document.getElementById('entry-list');
    const article=document.getElementById('article');
    const search=document.getElementById('search');
    let filter='all';

    function visibleEntries(){
      const q=search.value.trim().toLowerCase();
      return entries.filter(e=>(filter==='all'||e.visibility===filter)&&(`${e.title} ${e.type} ${e.summary}`).toLowerCase().includes(q));
    }
    function showEntry(id){
      const entry=entries.find(e=>e.id===id); if(!entry)return;
      document.querySelectorAll('.entry-card').forEach(card=>card.classList.toggle('active',card.dataset.id===id));
      article.innerHTML=`<header class="article-header"><span class="badge ${entry.visibility}">${entry.visibility}</span><h2>${escapeHtml(entry.title)}</h2><div class="entry-meta">${escapeHtml(entry.type)}</div></header>${entry.html}`;
      article.querySelectorAll('[data-entry-link]').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();showEntry(link.dataset.entryLink)}));
      history.replaceState(null,'',`#${id}`);
    }
    function escapeHtml(value){const el=document.createElement('div');el.textContent=value;return el.innerHTML}
    function renderList(){
      const visible=visibleEntries();
      list.innerHTML=visible.length?visible.map(e=>`<button class="entry-card" data-id="${escapeHtml(e.id)}"><span class="entry-title">${escapeHtml(e.title)}</span><span class="entry-meta"><span class="badge ${e.visibility}">${e.visibility}</span>${escapeHtml(e.type)}</span></button>`).join(''):'<div class="empty">沒有符合的條目。</div>';
      list.querySelectorAll('.entry-card').forEach(card=>card.addEventListener('click',()=>showEntry(card.dataset.id)));
    }
    search.addEventListener('input',renderList);
    document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('.filter').forEach(item=>item.classList.toggle('active',item===button));renderList()}));
    renderList();
    const initial=location.hash.slice(1)||entries[0]?.id;if(initial)showEntry(initial);
  </script>
</body>
